name: Build rakazo with Nix

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/rakazo-nix.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out rakazo
        uses: actions/checkout@v4
        with:
          repository: elie222/rakazo
          ref: 7e452be093027365637b84a45c3ca4463600bcc1
          path: upstream
      - name: Set image names
        id: names
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "base=ghcr.io/${owner}/rakazo-computer-base:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/rakazo-computer-nix" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push upstream base
        uses: docker/build-push-action@v6
        with:
          context: upstream/infra/sandboxes/computer
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.base }}
          cache-from: type=gha,scope=rakazo-base
          cache-to: type=gha,mode=max,scope=rakazo-base
      - name: Build and push Nix image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RAKAZO_BASE=${{ steps.names.outputs.base }}
          tags: |
            ${{ steps.names.outputs.image }}:latest
            ${{ steps.names.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=rakazo-nix
          cache-to: type=gha,mode=max,scope=rakazo-nix
