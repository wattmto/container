name: Build rakazo with Nix

on:
  push:
    branches: [main]
    paths:
      - rakazo-computer-nix/**
      - .github/workflows/rakazo-nix.yml
  pull_request:
    paths:
      - rakazo-computer-nix/**
      - .github/workflows/rakazo-nix.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out rakazo
        uses: actions/checkout@v4
        with:
          repository: elie222/rakazo
          ref: 7e452be093027365637b84a45c3ca4463600bcc1
          path: upstream
      - name: Set image names
        id: names
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "base=localhost:5000/rakazo-computer-base:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          image="ghcr.io/${owner}/rakazo-computer-nix"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            echo "tags=${image}:pr-${PR_NUMBER}-${PR_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          else
            {
              echo 'tags<<EOF'
              echo "${image}:latest"
              echo "${image}:${GITHUB_SHA}"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - uses: docker/setup-qemu-action@v3
      - name: Start local registry for the intermediate image
        run: docker run -d --restart=always -p 5000:5000 --name rakazo-build-registry registry:2
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build upstream base into local registry
        uses: docker/build-push-action@v6
        with:
          context: upstream/infra/sandboxes/computer
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.base }}
          cache-from: type=gha,scope=rakazo-base
          cache-to: type=gha,mode=max,scope=rakazo-base
      - name: Build Nix image
        uses: docker/build-push-action@v6
        with:
          context: rakazo-computer-nix
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          build-args: |
            RAKAZO_BASE=${{ steps.names.outputs.base }}
          tags: ${{ steps.names.outputs.tags }}
          cache-from: type=gha,scope=rakazo-nix
          cache-to: type=gha,mode=max,scope=rakazo-nix
