name: Build rakazo with Nix

on:
  push:
    branches: [main]
    paths:
      - rakazo-computer-nix/**
      - .github/workflows/rakazo-nix.yml
  pull_request:
    paths:
      - rakazo-computer-nix/**
      - .github/workflows/rakazo-nix.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out rakazo
        uses: actions/checkout@v4
        with:
          repository: elie222/rakazo
          ref: 7e452be093027365637b84a45c3ca4463600bcc1
          path: upstream
      - name: Set image names
        id: names
        shell: bash
        run: |
          echo "base=localhost:5000/rakazo-computer-base:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rakazo-computer-nix
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=sha,format=long,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }},enable=${{ github.event_name == 'pull_request' }}
      - uses: docker/setup-qemu-action@v3
      - name: Start local registry for the intermediate image
        run: docker run -d --restart=always -p 5000:5000 --name rakazo-build-registry registry:2
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build upstream base into local registry
        uses: docker/build-push-action@v6
        with:
          context: upstream/infra/sandboxes/computer
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.base }}
          cache-from: type=gha,scope=rakazo-base
          cache-to: type=gha,mode=max,scope=rakazo-base
      - name: Build Nix image
        uses: docker/build-push-action@v6
        with:
          context: rakazo-computer-nix
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          build-args: |
            RAKAZO_BASE=${{ steps.names.outputs.base }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=rakazo-nix
          cache-to: type=gha,mode=max,scope=rakazo-nix
